[project]
name = "pm-shell"
version = "0.1.0"
description = "A git-like shell for Jira boards. Clone a board to .jira/, edit locally, push when ready."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dhanush Ramkumar" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
pm = "pm_shell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
